schema_version: 1

context:
  name: dtool_lookup_server
  version: 0.18.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-lookup-server/dtool-lookup-server-${{ version }}.tar.gz
  sha256: 1aca3bf5644f41f25531ee52d109ab829a067421c5c01f3b5a64a69056179edf

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools <81
  run:
    - alembic
    - dtool_ecs
    - dtool_irods
    - dtool_s3
    - dtoolcore >=3.18.0
    - flask
    - flask-cors
    - flask-jwt-extended >=4.0
    - flask-migrate
    - flask-pymongo
    - flask-sqlalchemy
    - flask-smorest
    - flask-marshmallow
    - pymongo
    - python >=${{ python_min }}
    - pyyaml
    - marshmallow-sqlalchemy
    - setuptools <81

tests:
  - python:
      imports:
        - dtool_lookup_server
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Web API to register/lookup/search for dtool dataset metadata
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jic-dtool/dtool-lookup-server

extra:
  recipe-maintainers:
    - jan-janssen
